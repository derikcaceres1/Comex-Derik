schema:
  Data: datetime
  ncm: int
  pais_id: int
  pais_name: str
  peso: float
  valor: float
  valor_cif: float
  frete: float
  seguro: float

ARG:
  export:
    ncm: ncm
    pdes: pais_id
    pnet(kg): peso
    fob(usd): valor
    columns: ['Data', 'ncm', 'ImportExport', 'pais_id', 'peso', 'valor']
  import:
    ncm: ncm
    porg: pais_id
    pnet(kg): peso
    fob(usd): valor
    flete(usd): frete
